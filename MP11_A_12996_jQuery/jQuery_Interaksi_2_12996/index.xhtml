<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"
type="text/javascript"></script>
<style type="text/css">
body {
  font-family: Arial, sans-serif;
  margin: 30px;
}
.hasil {
  margin-top: 15px;
  padding: 10px;
  border: 1px solid grey;
  width: 300px;
}
</style>
<script type="text/javascript">
$(document).ready(function() {
  $("#btnSapa").click(function() {
    const nama = $("#nama").val();
    if(nama === "") {
      $("#hasilSapa").text(
        "Nama belum diisi!!");
      $("#hasilSapa").css("color", "red");
    } else {
      $("#hasilSapa").text(
        "Halo, " + nama + "! Selamat belajar jQuery.");
      $("#hasilSapa").css("color", "black");
    }
  });

  $("#pilihNama").change(function() {
    const warna = $(this).val();
    const namaWarna = {
      merah: "merah",
      biru: "biru",
      hijau: "hijau"
    };
    $("#hasilNama").text(
      warna === "" ? "Warna yang dipilih akan ditampilkan di sini."
      : "Nama yang dipilih adalah " + namaWarna[warna]);
    $("#hasilNama").css("color",
      warna === "merah" ? "red" :
      warna === "biru" ? "blue" :
      warna === "hijau" ? "green" : "black");
  });
});
</script>
</head>
<body>
<h2>Interaksi Pengguna</h2>
<h3>1. Menyapa Pengguna</h3>
<label for="nama">Masukan Nama:</label>
<input type="text" id="nama"/>
<button id="btnSapa">Sapa Saya</button>
<p id="hasilSapa" class="hasil">Hasil sapaan akan ditampilkan di sini.</p>

<h3>2. Memilih Warna Favorit</h3>
<label for="pilihNama">Pilih Warna:</label>
<select id="pilihNama">
  <option value="">-- Pilih Nama --</option>
  <option value="merah">Merah</option>
  <option value="biru">Biru</option>
  <option value="hijau">Hijau</option>
</select>
<p id="hasilNama" class="hasil">Warna yang dipilih akan ditampilkan di sini.</p>
</body>
</html>
